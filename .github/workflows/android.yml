# Builds an installable Android APK in the cloud. Run it from GitHub: Actions tab -> "Build Android APK" -> Run workflow.
name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Live site the app should open
        default: https://oncall-centre-app.vercel.app
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
        env: { VITE_DEMO_DATA: '' }
      - name: Create Android project
        run: |
          npx cap add android
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n    <application#' $F
          sed -i 's#android:theme="@style/AppTheme.NoActionBar"#android:theme="@style/AppTheme.NoActionBar" android:windowSoftInputMode="adjustResize"#' $F
        env: { CAP_SERVER_URL: '${{ inputs.server_url }}' }
      - name: Copy icons into the app
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do n=${d%%:*}; s=${d##*:}; mkdir -p android/app/src/main/res/mipmap-$n; convert public/icons/icon-512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/ic_launcher.png; cp android/app/src/main/res/mipmap-$n/ic_launcher.png android/app/src/main/res/mipmap-$n/ic_launcher_round.png; cp android/app/src/main/res/mipmap-$n/ic_launcher.png android/app/src/main/res/mipmap-$n/ic_launcher_foreground.png; done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
      - run: npx cap sync android
        env: { CAP_SERVER_URL: '${{ inputs.server_url }}' }
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OG-Calls-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
